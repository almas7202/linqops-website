<!DOCTYPE html>
<html>
<head>
  <title>Contact Form Notification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .header {
      background: linear-gradient(to right, #3b82f6, #8b5cf6);
      color: white;
      padding: 15px;
      border-radius: 5px 5px 0 0;
      margin: -20px -20px 20px;
    }
    .field {
      margin-bottom: 15px;
    }
    .label {
      font-weight: bold;
      color: #555;
    }
    .value {
      margin-top: 5px;
    }
    .message-box {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 5px;
      border-left: 4px solid #3b82f6;
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>New Contact Form Submission</h2>
    </div>
    
    <p>Someone has reached out through the website contact form. Here are their details:</p>
    
    <div class="field">
      <div class="label">Name:</div>
      <div class="value">{{from_name}}</div>
    </div>
    
    <div class="field">
      <div class="label">Email:</div>
      <div class="value">{{from_email}}</div>
    </div>
    
    <div class="field">
      <div class="label">Phone Number:</div>
      <div class="value">{{phone_number}}</div>
    </div>
    
    <div class="field">
      <div class="label">Message:</div>
      <div class="value message-box">{{message}}</div>
    </div>
    
    <div class="footer">
      <p>This is an automated notification from your website contact form.</p>
    </div>
  </div>
</body>
</html>
